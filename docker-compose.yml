services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: surpluss-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: surpluss
      POSTGRES_USER: surpluss
      POSTGRES_PASSWORD: surpluss_secret
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U surpluss -d surpluss']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─── Database Migration ────────────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    container_name: surpluss-migrate
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://surpluss:surpluss_secret@postgres:5432/surpluss
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # ─── NestJS API ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: surpluss-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://surpluss:surpluss_secret@postgres:5432/surpluss
      PORT: 3000
      CORS_ORIGIN: http://localhost:3001
      MAX_RETRY_ATTEMPTS: 5
      RETRY_INITIAL_DELAY_MS: 2000
      RETRY_MAX_DELAY_MS: 60000
      RETRY_BACKOFF_MULTIPLIER: 2
      WORKER_LEASE_DURATION_MS: 30000
      WORKER_HEARTBEAT_INTERVAL_MS: 10000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Worker 1 ─────────────────────────────────────────────────────────────
  worker1:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: surpluss-worker1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://surpluss:surpluss_secret@postgres:5432/surpluss
      WORKER_ID: worker-1
      WORKER_POLL_INTERVAL_MS: 1000
      WORKER_LEASE_DURATION_MS: 30000
      WORKER_HEARTBEAT_INTERVAL_MS: 10000
      WORKER_RECOVERY_INTERVAL_MS: 15000
      MAX_RETRY_ATTEMPTS: 5
      RETRY_INITIAL_DELAY_MS: 2000
      RETRY_MAX_DELAY_MS: 60000
      RETRY_BACKOFF_MULTIPLIER: 2
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ─── Worker 2 ─────────────────────────────────────────────────────────────
  worker2:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: surpluss-worker2
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://surpluss:surpluss_secret@postgres:5432/surpluss
      WORKER_ID: worker-2
      WORKER_POLL_INTERVAL_MS: 1000
      WORKER_LEASE_DURATION_MS: 30000
      WORKER_HEARTBEAT_INTERVAL_MS: 10000
      WORKER_RECOVERY_INTERVAL_MS: 15000
      MAX_RETRY_ATTEMPTS: 5
      RETRY_INITIAL_DELAY_MS: 2000
      RETRY_MAX_DELAY_MS: 60000
      RETRY_BACKOFF_MULTIPLIER: 2
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ─── Next.js Frontend ─────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: surpluss-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - '3001:3001'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
